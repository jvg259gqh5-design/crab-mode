body::before{
  content:'';position:fixed;inset:0;z-index:0;
  background:rgba(16,13,32,0.82);
  pointer-events:none;
}

/* МАГИЧЕСКИЕ ЧАСТИЦЫ */
.particle{
  position:fixed;pointer-events:none;z-index:0;
  font-size:12px;animation:particleFloat linear infinite;opacity:0;
  max-width:20px;overflow:hidden;
}
@keyframes particleFloat{
  0%{transform:translateY(100vh) rotate(0deg);opacity:0;}
  15%{opacity:0.35;}
  85%{opacity:0.35;}
  100%{transform:translateY(-30px) rotate(360deg);opacity:0;}
}

/* HEADER */
.hdr{text-align:center;padding:16px 16px 10px;border-bottom:1px solid rgba(167,139,250,0.12);position:relative;z-index:2;background:rgba(16,13,32,0.5);}
.hdr h1{font-size:24px;font-weight:800;background:linear-gradient(135deg,var(--gold),var(--pink),var(--purple));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:1px;}
.hdr p{font-size:11px;color:var(--dim);margin-top:3px;letter-spacing:2px;text-transform:uppercase;}
.hdr .dev{font-size:10px;color:rgba(167,139,250,0.4);margin-top:4px;}

/* ИТОГО */
.total-bar{
  background:linear-gradient(135deg,rgba(167,139,250,0.12),rgba(255,215,0,0.08));
  border:1px solid rgba(167,139,250,0.2);
  border-radius:14px;margin:12px 16px 0;padding:12px 16px;
  display:flex;justify-content:space-between;align-items:center;
  position:relative;z-index:1;
}

.tabs{display:flex;border-bottom:1px solid rgba(255,255,255,0.07);position:relative;z-index:2;background:rgba(16,13,32,0.4);}
.tab{flex:1;padding:11px 4px;text-align:center;cursor:pointer;font-size:11px;font-weight:700;
  letter-spacing:1px;color:var(--dim);border-bottom:2px solid transparent;transition:.2s;text-transform:uppercase;}
.tab.on{color:var(--purple);border-bottom-color:var(--purple);}
.tc{display:none;padding-bottom:40px;position:relative;z-index:1;}
.tc.on{display:block;}

.sec{font-size:10px;color:var(--dim);letter-spacing:3px;text-transform:uppercase;padding:0 16px;margin:14px 0 8px;}
.card{background:var(--s1);border-radius:16px;padding:16px;margin:0 16px 12px;border:1px solid rgba(255,255,255,0.06);}
.inp{width:100%;background:var(--bg);border:1px solid rgba(255,255,255,0.1);border-radius:10px;
  padding:10px 14px;color:var(--text);font-family:'Nunito',sans-serif;font-size:18px;font-weight:700;outline:none;}
.inp:focus{border-color:var(--purple);}
.btn{border:none;border-radius:10px;padding:12px;font-family:'Nunito',sans-serif;font-weight:800;
  font-size:15px;cursor:pointer;transition:.2s;width:100%;}
.btn:active{transform:scale(.97);}
.btn-main{background:linear-gradient(135deg,var(--purple),#7C3AED);color:white;}
.btn-sm{border:none;border-radius:8px;padding:6px 14px;font-family:'Nunito',sans-serif;
  font-weight:700;font-size:12px;cursor:pointer;transition:.2s;}
.btn-sm:active{transform:scale(.96);}

/* БАНОЧКИ */
.jars-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:20px 12px 12px;width:calc(100% - 24px);}
.jar-card{background:var(--s1);border-radius:16px;padding:10px;padding-top:30px;border:1px solid rgba(255,255,255,0.06);
  display:flex;flex-direction:column;align-items:center;transition:.3s;overflow:visible;min-width:0;}
.jar-wrap{position:relative;width:90px;height:110px;margin-bottom:10px;}
.jar-pct-badge{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  font-size:13px;font-weight:800;color:white;text-shadow:0 1px 3px rgba(0,0,0,0.5);pointer-events:none;}
.jar-fairy{position:absolute;bottom:calc(100% - 2px);left:50%;transform:translateX(-50%);
  font-size:22px;animation:float 3s ease-in-out infinite;filter:drop-shadow(0 2px 4px rgba(0,0,0,0.3));}
@keyframes float{0%,100%{transform:translateX(-50%) translateY(0);}50%{transform:translateX(-50%) translateY(-6px);}}
.jar-empty-hint{font-size:10px;color:var(--dim);text-align:center;font-style:italic;margin-bottom:6px;}

/* ФЕЯ ВАЛЮТЫ */
.currency-card{
  background:linear-gradient(135deg,rgba(255,215,0,0.1),rgba(255,182,100,0.07));
  border:1px solid rgba(255,215,0,0.25);border-radius:20px;padding:18px;margin:0 16px 12px;
  position:relative;overflow:hidden;
}
.currency-card::before{content:'';position:absolute;top:-30px;right:-30px;width:120px;height:120px;
  background:radial-gradient(circle,rgba(255,215,0,0.08),transparent 70%);border-radius:50%;}
.currency-tabs{display:flex;gap:8px;margin-top:12px;margin-bottom:10px;}
.ctab{flex:1;padding:8px;text-align:center;border-radius:10px;cursor:pointer;font-weight:800;font-size:14px;
  border:1px solid rgba(255,255,255,0.1);transition:.2s;background:var(--bg);}
.ctab.on{border-color:var(--gold);background:rgba(255,215,0,0.1);}

/* НАСТРОЙКИ */
.jar-settings{background:var(--s2);border-radius:12px;padding:12px;margin-top:6px;display:none;width:100%;}
.jar-settings.show{display:block;}
.settings-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.settings-label{font-size:11px;color:var(--dim);width:80px;flex-shrink:0;}
.settings-inp{flex:1;background:var(--bg);border:1px solid rgba(255,255,255,0.1);border-radius:8px;
  padding:6px 10px;color:var(--text);font-family:'Nunito',sans-serif;font-size:14px;font-weight:700;outline:none;}

/* SPLIT */
.split-card{background:linear-gradient(135deg,rgba(167,139,250,0.12),rgba(255,215,0,0.06));
  border:1px solid rgba(167,139,250,0.25);border-radius:16px;padding:16px;margin:0 16px 12px;}
.split-result{display:flex;gap:8px;margin-top:12px;overflow-x:auto;padding-bottom:4px;}
.split-item{flex-shrink:0;background:var(--s1);border-radius:12px;padding:10px 12px;
  text-align:center;min-width:90px;border:1px solid rgba(255,255,255,0.06);}

/* ЛОГ */
.log-item{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;
  background:var(--s1);border-radius:10px;margin-bottom:5px;animation:si .3s ease;}
@keyframes si{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:translateY(0)}}

.toast{position:fixed;top:18px;left:50%;transform:translateX(-50%) translateY(-110px);
  background:var(--s2);border:1px solid var(--purple);border-radius:12px;padding:11px 20px;
  font-size:13px;font-weight:700;color:var(--purple);z-index:999;transition:transform .3s;white-space:nowrap;}
.toast.on{transform:translateX(-50%) translateY(0);}

::-webkit-scrollbar{width:3px;}
::-webkit-scrollbar-thumb{background:var(--purple);border-radius:2px;}
</style>
</head>
<body>

<div id="particles" style="position:fixed;top:0;left:0;width:100vw;height:100vh;overflow:hidden;pointer-events:none;z-index:0;"></div>

<div class="hdr">
  <h1>🧚 БАНОЧКИ</h1>
  <p>Магия финансов · Система фей</p>
  <div class="dev">✨ Разработано: Полина & Клоди ✨</div>
</div>

<!-- total hidden -->

<div class="tabs">
  <div class="tab on" onclick="sw('main')">🧚 БАНОЧКИ</div>
  <div class="tab" onclick="sw('split')">💰 РАЗДЕЛИТЬ</div>
  <div class="tab" onclick="sw('log')">📜 ЛОГИ</div>
</div>

<!-- ══════ БАНОЧКИ ══════ -->
<div class="tc on" id="tc-main">
  <div style="height:14px"></div>
  <div class="sec">🧚 МОИ БАНОЧКИ</div>
  <div class="jars-grid" id="jarsGrid"></div>

  <!-- ФЕЯ ВАЛЮТЫ -->
  <div class="sec">👑 ФЕЯ ВАЛЮТЫ</div>
  <div class="currency-card">
    <div style="display:flex;align-items:center;gap:14px;">
      <div style="font-size:52px;animation:float 3s ease-in-out infinite;filter:drop-shadow(0 4px 12px rgba(255,215,0,0.3))">👑</div>
      <div style="flex:1">
        <div style="font-size:17px;font-weight:800;color:var(--gold)">Фея Валюты</div>
        <div style="font-size:11px;color:rgba(255,215,0,0.6);margin-bottom:8px">Неприкосновенный запас 🔒</div>
        <div style="display:flex;gap:16px;">
          <div>
            <div style="font-size:10px;color:rgba(255,215,0,0.6)">ЕВРО</div>
            <div style="font-size:24px;font-weight:800;color:var(--gold)" id="euroAmt">0 €</div>
          </div>
          <div>
            <div style="font-size:10px;color:rgba(126,200,138,0.8)">ДОЛЛАР</div>
            <div style="font-size:24px;font-weight:800;color:var(--green)" id="dollarAmt">0 $</div>
          </div>
        </div>
      </div>
    </div>

    <!-- ПЕРЕКЛЮЧАТЕЛЬ ВАЛЮТЫ -->
    <div class="currency-tabs">
      <div class="ctab on" id="ctab-eur" onclick="setCurrency('eur')">🇪🇺 ЕВРО</div>
      <div class="ctab" id="ctab-usd" onclick="setCurrency('usd')">🇺🇸 ДОЛЛАР</div>
    </div>

    <div style="display:flex;gap:8px;">
      <input class="inp" type="number" id="currencyIn" placeholder="0" inputmode="decimal"
        style="font-size:15px;padding:8px 12px;border-color:rgba(255,215,0,0.2);">
      <button class="btn-sm" onclick="addCurrency()"
        style="background:var(--gold);color:#100D20;font-weight:800;white-space:nowrap;padding:8px 14px">+ ДОБАВИТЬ</button>
      <button class="btn-sm" onclick="spendCurrency()"
        style="background:rgba(239,68,68,0.15);color:#EF4444;white-space:nowrap;padding:8px 14px">- ВЗЯТЬ</button>
    </div>
  </div>
</div>

<!-- ══════ РАЗДЕЛИТЬ ══════ -->
<div class="tc" id="tc-split">
  <div style="height:14px"></div>
  <div class="sec">💰 ВВЕДИ СУММУ</div>
  <div class="split-card">
    <input class="inp" type="number" id="splitIn" placeholder="Введи сумму в леях" inputmode="numeric" style="margin-bottom:10px;">
    <button class="btn btn-main" onclick="calcSplit()">✨ РАСПРЕДЕЛИТЬ ПО БАНОЧКАМ</button>
    <div class="split-result" id="splitResult" style="display:none;"></div>
    <button class="btn" id="splitAddBtn" onclick="applySplit()"
      style="display:none;margin-top:10px;background:var(--green);color:#100D20;font-weight:800;">🧚 ДОБАВИТЬ В БАНОЧКИ</button>
  </div>
  <div class="sec">⚙️ НАСТРОЙКА ПРОЦЕНТОВ</div>
  <div class="card" id="pctSettings"></div>
</div>

<!-- ══════ ЛОГИ ══════ -->
<div class="tc" id="tc-log">
  <div style="height:14px"></div>
  <div class="sec">📜 ВСЕ ОПЕРАЦИИ</div>
  <div style="margin:0 16px;" id="logList">
    <div style="text-align:center;padding:40px;color:var(--dim);font-size:13px">Операций пока нет ✨</div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const JARS_CONFIG = [
  {id:'wants',  name:'Хотелки',  emoji:'🛍️', fairy:'🛍️', color:'#FF8FAB', liquid:'rgba(255,143,171,0.65)',
   hints:['Пока пусто... но скоро! 🛍️','Мечты ждут своего часа ✨','Копи на что-то классное! 💕']},
  {id:'home',   name:'Дом',      emoji:'🏡', fairy:'🌿', color:'#7EC88A', liquid:'rgba(126,200,138,0.65)',
   hints:['Твой сад мечты ждёт 🌿','Каждый лей ближе к дому 🏡','Расти как розмарин! 🌱']},
  {id:'growth', name:'Развитие', emoji:'📚', fairy:'⭐', color:'#A78BFA', liquid:'rgba(167,139,250,0.65)',
   hints:['Инвестируй в себя ⭐','Знания — лучший актив 📚','Ты уже растёшь! 🚀']},
  {id:'safety', name:'Перьевых', emoji:'🛡️', fairy:'🔮', color:'#C0C0C0', liquid:'rgba(192,192,192,0.55)',
   hints:['Твоя подушка безопасности 🛡️','Спокойствие начинается здесь 🔮','Защити своё будущее! ✨']},
  {id:'rest',   name:'Отдых',    emoji:'✈️', fairy:'🦋', color:'#60C4F0', liquid:'rgba(96,196,240,0.65)',
   hints:['Куда полетим? ✈️','Отдых — это тоже инвестиция 🦋','Мир ждёт тебя! 🌍']},
];

const MOTIVATIONS = ['Каждый лей считается ✨','Ты строишь своё будущее 🌟','Маленькие шаги — большие мечты 🧚'];

let activeCurrency = 'eur';
let pendingSplit = null;

let state = JSON.parse(localStorage.getItem('banocki_v4') || JSON.stringify({
  euro:0, dollar:0,
  jars:{
    wants: {amt:0,pct:20,goal:0},
    home:  {amt:0,pct:20,goal:0},
    growth:{amt:0,pct:20,goal:0},
    safety:{amt:0,pct:20,goal:0},
    rest:  {amt:0,pct:20,goal:0},
  },
  log:[]
}));

function save(){localStorage.setItem('banocki_v4',JSON.stringify(state));}

// ЧАСТИЦЫ
function initParticles(){
  const emojis=['✨','⭐','💫','✦','˚','·','★'];
  const c=document.getElementById('particles');
  for(let i=0;i<14;i++){
    const p=document.createElement('div');
    p.style.cssText=`
      position:absolute;
      pointer-events:none;
      left:${5+Math.random()*88}%;
      font-size:${7+Math.random()*7}px;
      opacity:0;
      animation:particleFloat ${10+Math.random()*14}s linear ${-Math.random()*20}s infinite;
    `;
    p.textContent=emojis[Math.floor(Math.random()*emojis.length)];
    c.appendChild(p);
  }
}

function sw(name){
  document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('on',['main','split','log'][i]===name));
  document.querySelectorAll('.tc').forEach(c=>c.classList.remove('on'));
  document.getElementById('tc-'+name).classList.add('on');
  if(name==='split')renderPctSettings();
  if(name==='log')renderLog();
}

function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('on');
  setTimeout(()=>t.classList.remove('on'),2500);
}

function setCurrency(cur){
  activeCurrency=cur;
  document.getElementById('ctab-eur').classList.toggle('on',cur==='eur');
  document.getElementById('ctab-usd').classList.toggle('on',cur==='usd');
}

function addCurrency(){
  const v=parseFloat(document.getElementById('currencyIn').value)||0;
  if(v<=0)return;
  const sym=activeCurrency==='eur'?'€':'$';
  if(activeCurrency==='eur') state.euro+=v;
  else state.dollar+=v;
  state.log.unshift({date:new Date().toLocaleDateString('ru-RU'),desc:`👑 Фея Валюты`,amt:`+${v}${sym}`,color:'#FFD700'});
  document.getElementById('currencyIn').value='';
  save();renderAll();toast(`+${v}${sym} к Фее Валюты 👑`);
}

function spendCurrency(){
  const v=parseFloat(document.getElementById('currencyIn').value)||0;
  const bal=activeCurrency==='eur'?state.euro:state.dollar;
  const sym=activeCurrency==='eur'?'€':'$';
  if(v<=0||v>bal){toast('⚠️ Недостаточно средств!');return;}
  if(activeCurrency==='eur') state.euro-=v;
  else state.dollar-=v;
  state.log.unshift({date:new Date().toLocaleDateString('ru-RU'),desc:`👑 Фея Валюты (трата)`,amt:`-${v}${sym}`,color:'#EF4444'});
  document.getElementById('currencyIn').value='';
  save();renderAll();toast(`-${v}${sym} из Феи Валюты`);
}

function calcSplit(){
  const v=parseInt(document.getElementById('splitIn').value)||0;
  if(v<=0)return;
  pendingSplit=v;
  const res=document.getElementById('splitResult');
  const btn=document.getElementById('splitAddBtn');
  res.style.display='flex';btn.style.display='block';
  res.innerHTML=JARS_CONFIG.map(j=>{
    const pct=state.jars[j.id].pct;
    const amt=Math.round(v*pct/100);
    return`<div class="split-item">
      <span style="font-size:24px;display:block;margin-bottom:4px">${j.emoji}</span>
      <span style="font-size:10px;color:var(--dim);display:block">${j.name}</span>
      <span style="font-size:16px;font-weight:800;color:${j.color};display:block">${amt}</span>
      <span style="font-size:10px;color:var(--dim);display:block">${pct}%</span>
    </div>`;
  }).join('');
}

function applySplit(){
  if(!pendingSplit)return;
  JARS_CONFIG.forEach(j=>{
    const amt=Math.round(pendingSplit*state.jars[j.id].pct/100);
    state.jars[j.id].amt+=amt;
    state.log.unshift({date:new Date().toLocaleDateString('ru-RU'),desc:`${j.emoji} ${j.name}`,amt:`+${amt}`,color:j.color});
  });
  state.log.unshift({date:new Date().toLocaleDateString('ru-RU'),desc:`💰 Распределено ${pendingSplit} лей`,amt:'',color:'#A78BFA'});
  pendingSplit=null;
  document.getElementById('splitIn').value='';
  document.getElementById('splitResult').style.display='none';
  document.getElementById('splitAddBtn').style.display='none';
  save();renderAll();sw('main');toast('✨ Распределено по баночкам!');
}

function addToJar(id){
  const v=parseInt(document.getElementById('jinp-'+id).value)||0;
  if(v<=0)return;
  state.jars[id].amt+=v;
  const j=JARS_CONFIG.find(x=>x.id===id);
  state.log.unshift({date:new Date().toLocaleDateString('ru-RU'),desc:`${j.emoji} ${j.name}`,amt:`+${v}`,color:j.color});
  document.getElementById('jinp-'+id).value='';
  save();renderAll();toast(`+${v} в ${j.name}! ${j.fairy}`);
}

function spendFromJar(id){
  const v=parseInt(document.getElementById('jinp-'+id).value)||0;
  if(v<=0||v>state.jars[id].amt){toast('⚠️ Недостаточно средств!');return;}
  state.jars[id].amt-=v;
  const j=JARS_CONFIG.find(x=>x.id===id);
  state.log.unshift({date:new Date().toLocaleDateString('ru-RU'),desc:`${j.emoji} ${j.name} (трата)`,amt:`-${v}`,color:'#EF4444'});
  document.getElementById('jinp-'+id).value='';
  save();renderAll();toast(`-${v} из ${j.name}`);
}

function toggleSettings(id){document.getElementById('jset-'+id).classList.toggle('show');}

function saveJarSettings(id){
  const pct=parseInt(document.getElementById('spct-'+id).value)||20;
  const goal=parseInt(document.getElementById('sgoal-'+id).value)||0;
  state.jars[id].pct=pct;state.jars[id].goal=goal;
  save();renderAll();toast('✅ Настройки сохранены!');
}

function jarSVG(color,liquid,fillPct,fairy){
  const maxH=72;
  const h=Math.round(maxH*fillPct/100);
  const uid='j'+Math.random().toString(36).substr(2,6);
  return`<div class="jar-wrap">
    <svg viewBox="0 0 90 110" fill="none" xmlns="http://www.w3.org/2000/svg" style="width:90px;height:110px;filter:drop-shadow(0 4px 12px rgba(0,0,0,0.3))">
      <defs><clipPath id="${uid}"><path d="M14 20 Q12 25 12 35 L12 92 Q12 100 20 100 L70 100 Q78 100 78 92 L78 35 Q78 25 76 20 Z"/></clipPath></defs>
      <rect x="20" y="4" width="50" height="14" rx="4" fill="#211A3A" stroke="${color}" stroke-width="1.5"/>
      <rect x="24" y="7" width="42" height="8" rx="2" fill="#18132E" opacity="0.6"/>
      <path d="M14 20 Q12 25 12 35 L12 92 Q12 100 20 100 L70 100 Q78 100 78 92 L78 35 Q78 25 76 20 Z" fill="#18132E" stroke="${color}" stroke-width="1.5"/>
      ${h>0?`
        <rect x="12" y="${100-h}" width="66" height="${h+10}" fill="${liquid}" clip-path="url(#${uid})"/>
        <ellipse cx="45" cy="${100-h}" rx="32" ry="5" fill="${liquid}" opacity="0.9" clip-path="url(#${uid})">
          <animate attributeName="ry" values="5;7;5" dur="2s" repeatCount="indefinite"/>
          <animate attributeName="cy" values="${100-h};${100-h-2};${100-h}" dur="2s" repeatCount="indefinite"/>
        </ellipse>
      `:''}
      <path d="M20 28 Q19 40 19 65 L19 92" stroke="white" stroke-width="1.5" stroke-opacity="0.08" stroke-linecap="round"/>
    </svg>
    ${h>0?`<div class="jar-pct-badge">${fillPct}%</div>`:''}
    <div class="jar-fairy">${fairy}</div>
  </div>`;
}

function renderAll(){
  document.getElementById('euroAmt').textContent=state.euro.toFixed(2)+' €';
  document.getElementById('dollarAmt').textContent=state.dollar.toFixed(2)+' $';
  renderJars();
}

function renderJars(){
  const grid=document.getElementById('jarsGrid');
  grid.innerHTML=JARS_CONFIG.map(j=>{
    const jar=state.jars[j.id];
    const fillPct=jar.goal>0?Math.min(100,Math.round((jar.amt/jar.goal)*100)):
      jar.amt>0?Math.min(100,Math.round((jar.amt/10000)*100)):0;
    const hint=jar.amt===0?j.hints[Math.floor(Math.random()*j.hints.length)]:'';
    return`<div class="jar-card">
      ${jarSVG(j.color,j.liquid,fillPct,j.fairy)}
      <div style="font-size:13px;font-weight:800;color:${j.color};text-align:center;margin-bottom:2px">${j.name}</div>
      <div style="font-size:20px;font-weight:800;color:${j.color};text-align:center;margin-bottom:2px">${jar.amt.toLocaleString()} лей</div>
      ${jar.goal>0?`<div style="font-size:10px;color:var(--dim);text-align:center;margin-bottom:4px">Цель: ${jar.goal.toLocaleString()} лей</div>`:''}
      ${hint?`<div class="jar-empty-hint">${hint}</div>`:`<div style="font-size:10px;color:var(--dim);text-align:center;margin-bottom:6px">${jar.pct}% от дохода</div>`}
      <div style="width:100%">
        <input class="inp" type="number" id="jinp-${j.id}" placeholder="0 лей" inputmode="numeric"
          style="font-size:14px;padding:7px 10px;margin-bottom:6px;">
        <div style="display:flex;gap:5px;margin-bottom:6px;">
          <button class="btn-sm" onclick="addToJar('${j.id}')"
            style="background:${j.color}33;color:${j.color};flex:1">+ ДОБАВИТЬ</button>
          <button class="btn-sm" onclick="spendFromJar('${j.id}')"
            style="background:rgba(239,68,68,0.15);color:#EF4444;flex:1">- ВЗЯТЬ</button>
        </div>
        <button class="btn-sm" onclick="toggleSettings('${j.id}')"
          style="background:rgba(255,255,255,0.04);color:var(--dim);width:100%">⚙️ Настройки</button>
        <div class="jar-settings" id="jset-${j.id}">
          <div class="settings-row">
            <span class="settings-label">% от дохода</span>
            <input class="settings-inp" type="number" id="spct-${j.id}" value="${jar.pct}" inputmode="numeric">
          </div>
          <div class="settings-row">
            <span class="settings-label">Цель (лей)</span>
            <input class="settings-inp" type="number" id="sgoal-${j.id}" value="${jar.goal||''}" placeholder="0" inputmode="numeric">
          </div>
          <button class="btn-sm" onclick="saveJarSettings('${j.id}')"
            style="background:var(--purple);color:white;width:100%">💾 Сохранить</button>
        </div>
      </div>
    </div>`;
  }).join('');
}

function renderPctSettings(){
  const c=document.getElementById('pctSettings');
  c.innerHTML=JARS_CONFIG.map(j=>`
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px;">
      <span style="font-size:20px">${j.emoji}</span>
      <span style="flex:1;font-size:13px;font-weight:700;color:${j.color}">${j.name}</span>
      <input class="settings-inp" type="number" id="pct-${j.id}" value="${state.jars[j.id].pct}"
        inputmode="numeric" style="width:60px;text-align:center;">
      <span style="font-size:12px;color:var(--dim)">%</span>
    </div>`).join('')+
  `<button class="btn btn-main" onclick="savePcts()" style="margin-top:4px">💾 Сохранить проценты</button>`;
}

function savePcts(){
  JARS_CONFIG.forEach(j=>{
    const v=parseInt(document.getElementById('pct-'+j.id).value)||20;
    state.jars[j.id].pct=v;
  });
  save();renderAll();toast('✅ Проценты сохранены!');
}

function renderLog(){
  const c=document.getElementById('logList');
  if(!state.log.length){
    c.innerHTML='<div style="text-align:center;padding:40px;color:var(--dim);font-size:13px">Операций пока нет ✨</div>';
    return;
  }
  c.innerHTML=state.log.slice(0,50).map(l=>`
    <div class="log-item">
      <div style="font-size:12px;color:var(--dim)">${l.desc}</div>
      <div style="text-align:right;">
        <div style="font-size:13px;font-weight:700;color:${l.color||'var(--text)'}">${l.amt}</div>
        <div style="font-size:10px;color:var(--dim)">${l.date}</div>
      </div>
    </div>`).join('');
}

initParticles();
renderAll();

if('serviceWorker' in navigator){
  const swCode=`const C='banocki-v4';self.addEventListener('install',e=>e.waitUntil(caches.open(C).then(c=>c.addAll(['.']))));self.addEventListener('fetch',e=>e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request))));`;
  navigator.serviceWorker.register(URL.createObjectURL(new Blob([swCode],{type:'application/javascript'}))).catch(()=>{});
}
</script>
</body>
</html>
